<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Glow by Caty: tu rutina de skincare personalizada, creada por la farmacéutica Caty De Oliveira.">
<meta name="theme-color" content="#F4EFE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1D1915" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Glow">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="assets/icon-180.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<title>Glow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}.oprow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0}.oprow>span{font-size:14px}.opstars{display:flex;gap:6px}.opstars button{width:34px;height:34px;border-radius:50%;border:1px solid rgba(110,90,70,.25);background:rgba(255,255,255,.5);font:inherit;font-size:14px;color:inherit;cursor:pointer}.opstars button[aria-pressed=true]{background:var(--brown);color:#fff;border-color:var(--brown)}.linkbtn{background:none;border:0;padding:0;color:var(--brown);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font:inherit;font-size:13px}
/* Una columna de app móvil (máx. 440px) sobre fondo marfil con manchas de color difuminadas; vidrio esmerilado en tarjetas, hojas y barra de pestañas */
:root{
  --bg:#F4EFE6; --glass:rgba(255,252,246,.58); --glass-strong:rgba(255,252,246,.88);
  --line:rgba(92,72,52,.14); --ink:#33291F; --muted:#6E6255;
  --taupe:#7B7F6B; --brown:#6B4E3A; --sand:#B79F87;
  --sel-bg:#5E6350; --sel-fg:#FBF8F2; --btn-bg:#6B4E3A; --btn-fg:#FBF8F2;
  --warn:#9A5B2E; --danger:#8E3B2E; --track:rgba(92,72,52,.12);
  --bubble-me:#5E6350; --bubble-me-fg:#FBF8F2;
  --blob1:rgba(123,127,107,.45); --blob2:rgba(183,159,135,.5); --blob3:rgba(107,78,58,.18);
  --font:"Manrope",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --r-lg:26px; --r-md:18px; --r-sm:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1D1915; --glass:rgba(52,46,38,.55); --glass-strong:rgba(44,39,32,.92);
  --line:rgba(241,234,220,.12); --ink:#F1EADC; --muted:#BFB2A1;
  --taupe:#A3A992; --brown:#D9BC9E; --sand:#8C755F;
  --sel-bg:#AEB49C; --sel-fg:#1D1915; --btn-bg:#D9BC9E; --btn-fg:#1D1915;
  --warn:#E0A36F; --danger:#E58B79; --track:rgba(241,234,220,.12);
  --bubble-me:#AEB49C; --bubble-me-fg:#1D1915;
  --blob1:rgba(123,127,107,.38); --blob2:rgba(140,117,95,.35); --blob3:rgba(217,188,158,.12);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1D1915; --glass:rgba(52,46,38,.55); --glass-strong:rgba(44,39,32,.92);
  --line:rgba(241,234,220,.12); --ink:#F1EADC; --muted:#BFB2A1;
  --taupe:#A3A992; --brown:#D9BC9E; --sand:#8C755F;
  --sel-bg:#AEB49C; --sel-fg:#1D1915; --btn-bg:#D9BC9E; --btn-fg:#1D1915;
  --warn:#E0A36F; --danger:#E58B79; --track:rgba(241,234,220,.12);
  --bubble-me:#AEB49C; --bubble-me-fg:#1D1915;
  --blob1:rgba(123,127,107,.38); --blob2:rgba(140,117,95,.35); --blob3:rgba(217,188,158,.12);
  color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;min-height:100vh}
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bgfx i{position:absolute;border-radius:50%;filter:blur(60px)}
.bgfx i:nth-child(1){width:70vmax;height:70vmax;right:-30vmax;top:-30vmax;background:var(--blob1)}
.bgfx i:nth-child(2){width:60vmax;height:60vmax;left:-28vmax;top:45vh;background:var(--blob2)}
.bgfx i:nth-child(3){width:40vmax;height:40vmax;right:-10vmax;bottom:-18vmax;background:var(--blob3)}

#app{max-width:440px;margin:0 auto;padding-block:10px 140px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
small,.fine{color:var(--muted)}
.fine{font-size:13px;line-height:1.45}
button{font:inherit;color:inherit}
a{color:var(--brown)}
:focus-visible{outline:2px solid var(--brown);outline-offset:3px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);border:1px solid var(--line)}

/* barra de marca */
.brandbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;letter-spacing:-.01em}
.brand svg{width:22px;height:22px}
.brand span{font-weight:400;color:var(--muted)}
.protobtn{border:1px dashed var(--sand);background:transparent;border-radius:99px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}

/* botones */
.btn{display:block;width:100%;text-align:center;border:0;border-radius:var(--r-md);padding:16px 20px;font-weight:600;font-size:16px;background:var(--btn-bg);color:var(--btn-fg);cursor:pointer;transition:transform .15s,opacity .15s;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:var(--glass);color:var(--ink);border:1px solid var(--line);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.btn.danger{background:var(--danger);color:var(--btn-fg)}
.btn.sm{padding:10px 14px;font-size:14px;border-radius:12px;width:auto;display:inline-block}
.btn.proto{background:transparent;border:1px dashed var(--sand);color:var(--muted);font-size:14px;padding:12px}
.stack{display:grid;gap:10px}
.link{background:none;border:0;padding:0;color:var(--brown);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* bienvenida */
.hero{padding-block:44px 24px;display:grid;gap:18px}
.hero svg{width:64px;height:64px}
.wordmark{font-size:64px;line-height:.95;font-weight:300;letter-spacing:-.045em}
.wordmark small{display:block;font-size:17px;letter-spacing:0;font-weight:500;color:var(--muted);margin-top:10px}
.lead{font-size:19px;line-height:1.45;color:var(--muted);max-width:30ch}
.author{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:var(--r-md);margin-bottom:12px}
.avatar{flex:none;width:44px;height:44px;border-radius:50%;background:var(--sel-bg);color:var(--sel-fg);display:grid;place-items:center;font-weight:600;font-size:15px}
.author b{display:block;font-weight:600}
.author small{font-size:13px;line-height:1.35;display:block}
.facts{list-style:none;margin:0;padding:6px 18px;border-radius:var(--r-lg)}
.facts li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.facts li:first-child{border-top:0}
.facts b{font-weight:600}
.facts span{color:var(--muted);text-align:right}

/* cuestionario */
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.qhead div{display:grid;line-height:1.25}
.qhead small{font-size:13px}
.qhead b{font-weight:600}
.icon-btn{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:18px;height:18px}
.bar{height:4px;border-radius:9px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--taupe);border-radius:9px;transition:width .35s ease}
.qt{font-size:27px;line-height:1.2;font-weight:600;letter-spacing:-.02em;margin:26px 0 8px}
.hint{color:var(--muted);margin-bottom:6px}
.opts{display:grid;gap:10px;margin-top:20px}
.opts.grid{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 16px;border-radius:var(--r-md);cursor:pointer;min-height:56px;line-height:1.3;transition:background .15s,color .15s}
.opt .dot{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center}
.opt.multi .dot{border-radius:6px}
.opt[aria-pressed="true"]{background:var(--sel-bg);color:var(--sel-fg);border-color:var(--sel-bg)}
.opt[aria-pressed="true"] .dot{border-color:currentColor;background:currentColor}
.opt[aria-pressed="true"] .dot::after{content:"";width:6px;height:10px;border:solid var(--sel-bg);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.opts.grid .opt{font-size:15px;padding:13px 12px}
.field{width:100%;font:inherit;color:inherit;border-radius:var(--r-md);padding:16px;margin-top:20px}
textarea.field{min-height:140px;resize:vertical}
.num{display:flex;align-items:baseline;gap:10px;margin-top:20px}
.num input{width:140px;font-size:44px;font-weight:300;text-align:center;padding:10px;margin:0}
.num span{font-size:20px;color:var(--muted)}
.group{display:grid;gap:18px;margin-top:22px}
.group h3{font-size:14px;font-weight:600;color:var(--muted);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-btn{border-radius:99px;padding:10px 14px;font-size:15px;cursor:pointer;line-height:1.2}
.chip-btn[aria-pressed="true"]{background:var(--sel-bg);color:var(--sel-fg);border-color:var(--sel-bg)}
.qfoot{position:fixed;left:0;right:0;bottom:0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--bg) 55%,transparent)}
.qfoot .in{max-width:440px;margin:0 auto}

/* fotos */
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.slot{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:var(--r-md);display:grid;place-items:center;text-align:center;cursor:pointer;overflow:hidden;font-size:13px;padding:8px}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .lbl{position:relative;display:grid;gap:6px;justify-items:center;color:var(--muted)}
.slot .lbl svg{width:26px;height:26px}
.slot.has .lbl{position:absolute;left:6px;right:6px;bottom:6px;background:var(--glass-strong);color:var(--ink);border-radius:10px;padding:4px;font-weight:600}
.tips{margin-top:18px;padding:16px 18px;border-radius:var(--r-md);display:grid;gap:8px;font-size:15px}
.tips div{display:flex;gap:10px}
.tips div::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--taupe);margin-top:9px}

/* app */
.page-title{font-size:34px;font-weight:300;letter-spacing:-.03em;margin:10px 0 18px}
.card{border-radius:var(--r-lg);padding:20px;margin-bottom:14px}
.card h2{font-size:18px;font-weight:600;letter-spacing:-.01em;margin-bottom:10px}
.eyebrow{font-size:13px;color:var(--muted);font-weight:500}

/* Baumann */
.code{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:10px 0 16px}
.code span{display:grid;justify-items:center;gap:2px}
.code b{font-size:58px;line-height:1;font-weight:300;color:var(--brown);letter-spacing:-.02em}
.code em{font-style:normal;font-size:12px;color:var(--muted);text-align:center;line-height:1.2}
.spectra{display:grid;gap:14px;margin:6px 0 14px}
.spec-l{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}
.spec-l .on{color:var(--ink);font-weight:600}
.track{position:relative;height:8px;border-radius:9px;background:var(--track)}
.track::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line)}
.track i{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--brown);border:3px solid var(--bg);transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.desc{display:grid;gap:8px;margin-bottom:12px}
.desc div{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:15px}
.desc b{color:var(--brown);font-weight:700}

.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.two>div{min-width:0;display:grid;gap:8px;align-content:start}
.tagl{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-block;padding:5px 11px;border-radius:99px;font-size:13px;background:var(--track);line-height:1.3}
.tag.goal{background:var(--sel-bg);color:var(--sel-fg)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;margin:0;font-size:15px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;min-width:0}

.alerts{display:grid;gap:10px}
.alert{display:grid;grid-template-columns:8px 1fr;gap:12px;font-size:15px;line-height:1.45}
.alert::before{content:"";width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--taupe)}
.alert.warn::before{background:var(--warn)}
.ev{font-size:12px;font-weight:600;color:var(--brown);text-decoration:none;white-space:nowrap}
.ev:hover{text-decoration:underline}

/* rutina */
.rhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.rhead small{font-size:13px}
.steps{list-style:none;margin:0;padding:0}
.steps>li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;padding:16px 0;border-top:1px solid var(--line)}
.steps>li:first-child{border-top:0;padding-top:6px}
.steps .n{width:28px;height:28px;border-radius:50%;background:var(--track);display:grid;place-items:center;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.steps .n.done{background:var(--sel-bg);color:var(--sel-fg)}
.steps b.st{display:block;font-weight:600;margin-bottom:2px}
.steps p{font-size:15px}
.steps .why{display:block;font-size:13px;margin-top:4px;color:var(--muted)}
.prods{display:grid;gap:8px;margin-top:12px}
.prod{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:12px 12px 12px 14px;border-radius:14px;background:var(--glass-strong);border:1px solid var(--line)}
.prod .pb{font-size:12px;color:var(--muted);font-weight:500}
.prod .pn{font-size:14px;font-weight:600;line-height:1.3}
.prod .pm{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.store{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--track);color:var(--ink)}
.buy{grid-row:1/3;grid-column:2;align-self:center;border:0;border-radius:11px;padding:9px 12px;font-size:13px;font-weight:600;background:var(--btn-bg);color:var(--btn-fg);text-decoration:none;cursor:pointer}
.code-chip{border:1px dashed var(--sand);background:none;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:700;cursor:pointer;color:var(--ink)}
.have{margin-top:10px;border:1px solid var(--line);background:none;border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.have[aria-pressed="true"]{background:var(--sel-bg);color:var(--sel-fg);border-color:var(--sel-bg)}
.timeline{list-style:none;margin:4px 0 0;padding:0}
.timeline li{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.timeline li:first-child{border-top:0}
.timeline b{font-weight:600;font-variant-numeric:tabular-nums}
.signoff{display:flex;gap:12px;align-items:center;margin:8px 0 14px}
.signoff p{font-size:14px;color:var(--muted)}

/* planes */
.lockhero{text-align:center;display:grid;gap:10px;justify-items:center;padding:26px 20px}
.lockhero svg{width:40px;height:40px;color:var(--taupe)}
.stat{display:flex;justify-content:center;gap:18px;margin-top:4px}
.stat div{display:grid}
.stat b{font-size:28px;font-weight:300;font-variant-numeric:tabular-nums}
.stat small{font-size:12px}
.plan{position:relative}
.plan.feat{border:1.5px solid var(--sel-bg)}
.plan .badge{position:absolute;top:-11px;left:20px;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:700;background:var(--sel-bg);color:var(--sel-fg)}
.plan-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.plan-h h2{margin:0}
.price{text-align:right;white-space:nowrap}
.price b{font-size:28px;font-weight:600;letter-spacing:-.02em}
.price span{font-size:13px;color:var(--muted);margin-left:2px}
.feats{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:8px;font-size:15px}
.feats li{display:grid;grid-template-columns:18px 1fr;gap:8px}
.feats li::before{content:"";width:10px;height:6px;border:solid var(--taupe);border-width:0 0 2px 2px;transform:rotate(-45deg);margin-top:7px}

/* mensajes */
.thread{display:grid;gap:10px;margin-bottom:14px}
.msg{max-width:86%;padding:11px 14px;border-radius:18px;font-size:15px;line-height:1.45}
.msg.bot,.msg.caty{justify-self:start;border-bottom-left-radius:6px}
.msg.me{justify-self:end;background:var(--bubble-me);color:var(--bubble-me-fg);border-bottom-right-radius:6px}
.msg .who{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:2px}
.msg ul{margin:6px 0 0;padding-left:18px}
.qr{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.qr button{border-radius:99px;padding:9px 14px;font-size:14px;cursor:pointer;border:1px solid var(--sel-bg);background:var(--glass);color:var(--ink)}
.chathead{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:var(--r-md);margin-bottom:12px}
.chathead b{display:block}
.chathead small{font-size:13px}
.compose{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.compose textarea{margin:0;min-height:52px;max-height:140px;padding:13px 14px}
.compose .btn{width:auto;padding:14px 16px}

/* simular */
.seg{display:flex;padding:4px;border-radius:14px;gap:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--glass-strong);color:var(--ink);box-shadow:0 1px 6px rgba(0,0,0,.08)}
.compare{position:relative;border-radius:var(--r-lg);overflow:hidden;aspect-ratio:4/5;max-width:100%;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:ew-resize;background:var(--track)}
.compare img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.compare .after{position:absolute;inset:0}
.compare .handle{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.9);transform:translateX(-1px);pointer-events:none}
.compare .handle::after{content:"";position:absolute;top:50%;left:50%;width:36px;height:36px;border-radius:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,.6);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1.5px solid #fff}
.compare .lab{position:absolute;top:12px;padding:5px 11px;border-radius:99px;font-size:12px;font-weight:600;background:rgba(255,252,246,.72);color:#33291F;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.compare .lab.l{left:12px}.compare .lab.r{right:12px}
.compare .smp{position:absolute;left:12px;bottom:12px;padding:4px 10px;border-radius:99px;font-size:12px;background:rgba(51,41,31,.6);color:#FBF8F2}
.meter{display:grid;gap:6px;margin:12px 0}
.meter div:first-child{display:flex;justify-content:space-between;font-size:14px}
.meter div:first-child span:last-child{font-variant-numeric:tabular-nums;color:var(--muted)}
.meter .tr{height:6px;border-radius:9px;background:var(--track);overflow:hidden}
.meter .tr i{display:block;height:100%;background:var(--taupe);border-radius:9px}
.empty{text-align:center;display:grid;gap:14px;justify-items:center;padding:34px 22px}
.empty svg{width:44px;height:44px;color:var(--taupe)}

/* catálogo (solo prototipo) */
.cat h2{display:flex;justify-content:space-between;align-items:baseline}
.cat h2 small{font-size:12px;font-weight:500}
.catrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.catrow:first-of-type{border-top:0}
.catrow small{grid-column:1/-1;font-size:12px}

/* pestañas */
.tabs{position:fixed;left:0;right:0;bottom:0;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.tabs .in{max-width:440px;margin:0 auto;display:flex;padding:6px;border-radius:26px;pointer-events:auto;box-shadow:0 8px 30px rgba(51,41,31,.12)}
.tabs button{position:relative;flex:1;min-width:0;border:0;background:none;display:grid;justify-items:center;gap:2px;padding:8px 0 6px;border-radius:20px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--ink);background:var(--glass-strong)}
.tabs .pip{position:absolute;top:6px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--warn)}

/* hojas, avisos y notificación */
.sheet-wrap{position:fixed;inset:0;z-index:20;display:grid;align-items:end;background:rgba(29,25,21,.32)}
.sheet{max-width:470px;width:100%;margin:0 auto;border-radius:28px 28px 0 0;padding:10px max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(20px,env(safe-area-inset-left,0px));background:var(--glass-strong);-webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6);border:1px solid var(--line);max-height:88vh;overflow:auto;animation:up .28s ease}
.sheet .grab{width:38px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-size:20px;font-weight:600;margin-bottom:8px}
.sheet>p{color:var(--muted);margin-bottom:16px}
.maplist{list-style:none;margin:0 0 8px;padding:0}
.maplist li+li{border-top:1px solid var(--line)}
.maplist button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;background:none;padding:12px 2px;cursor:pointer;font-size:15px}
.maplist button span:last-child{color:var(--muted);font-size:13px}
.maplist button[aria-pressed="true"] span:first-child{font-weight:700}
.sheet h3{font-size:13px;color:var(--muted);font-weight:600;margin:14px 0 2px}
.paybox{padding:16px;border-radius:var(--r-md);margin-bottom:14px;display:grid;gap:6px}
.paybox .row{display:flex;justify-content:space-between;gap:10px}
.paybox b{font-weight:600}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);z-index:30;padding:10px 16px;border-radius:99px;font-size:14px;font-weight:500;max-width:calc(100% - 32px);width:max-content}
.notif{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);z-index:31;width:min(420px,calc(100% - 24px));padding:12px 14px;border-radius:20px;display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:center;text-align:left;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.16);animation:drop .35s ease}
.notif .ic{width:36px;height:36px;border-radius:9px;background:var(--sel-bg);display:grid;place-items:center}
.notif .ic svg{width:22px;height:22px}
.notif b{display:block;font-size:14px}
.notif span{font-size:14px;color:var(--muted)}
@keyframes drop{from{transform:translate(-50%,-30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:360px){.opts.grid{grid-template-columns:1fr}.code b{font-size:46px}.tabs button{font-size:10px}}

<script>
const KEY='glow.v1';
const TEST_MODE=false; /* true = todo desbloqueado para probar sin pagar */

/* ---------- Cuenta y pagos (Fase 2) ----------
   Sin email: cada móvil tiene un acceso anónimo de Supabase. Al pagar, su id viaja a Stripe
   (client_reference_id) y el webhook guarda el plan. Aquí solo se lee el plan. */
const SB_URL='https://pzucpyzggotcedvpghli.supabase.co';
const SB_KEY='sb_publishable_VXSxe5-1cIxyEqzvcFJQvw_3azjWfRE'; /* clave pública: segura en el navegador con RLS */
const PAY={esencial:'https://buy.stripe.com/5kQaEY2Iu0OgcMf4oF53O03',caty:'https://buy.stripe.com/28E00kcj40OgeUnf3j53O04'};
const PORTAL='https://billing.stripe.com/p/login/00weVe96SbsU6nR2gx53O00';
const CUENTA='glow.cuenta'; /* separado de tus datos: «Borrar todo» no te quita el plan */
let C=null;try{C=JSON.parse(localStorage.getItem(CUENTA))}catch(e){}
function saveC(){try{localStorage.setItem(CUENTA,JSON.stringify(C))}catch(e){}}
async function authReq(path,body){
 const r=await fetch(SB_URL+'/auth/v1/'+path,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
 const j=await r.json().catch(()=>({}));if(!r.ok||!j.access_token)throw new Error(j.msg||j.error_description||('auth '+r.status));return j}
function keepSession(j){C={uid:j.user.id,at:j.access_token,rt:j.refresh_token,exp:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600)};saveC()}
async function sesion(crear){
 if(C&&C.at&&C.exp-60>Date.now()/1000)return C;
 if(C&&C.rt){try{keepSession(await authReq('token?grant_type=refresh_token',{refresh_token:C.rt}));return C}catch(e){if(!crear)return null}}
 if(!crear)return null;
 keepSession(await authReq('signup',{data:{}}));return C}
async function syncPlan(){
 if(!C||!navigator.onLine)return false;
 try{
  const s=await sesion(false);if(!s)return false;
  const r=await fetch(SB_URL+'/rest/v1/suscripciones?select=plan,estado,vence',{headers:{apikey:SB_KEY,Authorization:'Bearer '+s.at}});
  if(!r.ok)return false;
  const act=(await r.json()).filter(x=>['active','trialing','past_due'].includes(x.estado)&&(!x.vence||new Date(x.vence).getTime()>Date.now()));
  const np=act.some(x=>x.plan==='caty')?'caty':act.length?'esencial':'free';
  const inv=act.filter(x=>x.vence).map(x=>x.vence).sort();
  const nv=act.some(x=>!x.vence)?null:(inv.length?inv[inv.length-1]:null);
  const cambio=np!==S.plan||nv!==(S.vence||null);S.plan=np;S.vence=nv;save();return cambio;
 }catch(e){return false}}
const tester=()=>!!S.inv&&!!S.vence&&paid(); /* amiga con invitación activa: nunca ve botones de pago */
const VER='1.5';
/* ---------- Contador anónimo de uso ----------
   Solo pasos de la app (nunca respuestas, fotos ni datos de piel). Id aleatorio del móvil, sin cookies. */
const DISP=(()=>{try{let d=localStorage.getItem('glow.disp');if(!d){d=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2));localStorage.setItem('glow.disp',d)}return d}catch(e){return 'sin-id'}})();
let colaEv=[];try{colaEv=JSON.parse(localStorage.getItem('glow.cola'))||[]}catch(e){}
let trackT;
function guardaCola(){try{localStorage.setItem('glow.cola',JSON.stringify(colaEv.slice(-300)))}catch(e){}}
function track(ev,dato){
 colaEv.push({disp:DISP,evento:ev,dato:dato==null?null:String(dato).slice(0,60),plan:['esencial','caty'].includes(S.plan)?S.plan:'free',prueba:!!S.inv,version:VER});
 guardaCola();clearTimeout(trackT);trackT=setTimeout(enviaUso,3000)}
async function enviaUso(fin){
 if(!colaEv.length||!navigator.onLine)return;
 const lote=colaEv.splice(0,100);guardaCola();
 try{const r=await fetch(SB_URL+'/rest/v1/eventos_uso',{method:'POST',keepalive:!!fin,headers:{apikey:SB_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(lote)});
  if(r.status>=500)throw 0}catch(e){colaEv=lote.concat(colaEv);guardaCola()}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)enviaUso(true)});

/* ---------- Avisos push ---------- */
const esIOS=/iP(hone|ad|od)/.test(navigator.userAgent);
const instalada=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const pushPosible=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
function b64aBytes(t){const r=(t+'='.repeat((4-t.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/');return Uint8Array.from(atob(r),c=>c.charCodeAt(0))}
async function rpc(nombre,args){const s=await sesion(true);const r=await fetch(SB_URL+'/rest/v1/rpc/'+nombre,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+s.at,'Content-Type':'application/json'},body:JSON.stringify(args||{})});const j=await r.json().catch(()=>null);if(!r.ok)throw new Error((j&&j.message)||('rpc '+r.status));return j}
async function guardarAviso(sub){const j=sub.toJSON();await rpc('guardar_aviso',{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth,p_bot_en:S.rutinaAt&&!S.botOn?new Date(S.rutinaAt+DOS_DIAS).toISOString():null})}
async function activarAvisos(){
 if(!pushPosible()){toast(esIOS&&!instalada()?'En iPhone, primero añade Glow a tu pantalla de inicio y ábrela desde ahí.':'Este navegador no permite avisos.');return false}
 if(!navigator.onLine){toast('Necesitas conexión a internet.');return false}
 try{
  const perm=await Notification.requestPermission();
  if(perm!=='granted'){track('avisos_no');toast('Sin permiso no podemos avisarte. Puedes cambiarlo en los ajustes del móvil.');return false}
  const reg=await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  if(!sub){const {publicKey}=await (await fetch(SB_URL+'/functions/v1/avisos')).json();sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64aBytes(publicKey)})}
  await guardarAviso(sub);S.avisos=true;save();track('avisos_si');toast('Listo: te avisaremos en este móvil.');return true;
 }catch(e){toast('No pudimos activar los avisos. Inténtalo de nuevo.');return false}}
async function actualizarAviso(){try{if(!S.avisos||!pushPosible()||!navigator.onLine)return;const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();if(sub)await guardarAviso(sub)}catch(e){}}

/* ---------- Perfil compartido con Caty (solo con consentimiento) ---------- */
function resumenPerfil(){
 if(!Object.keys(S.a).length)return null;
 try{const P=plan(),o=id=>{try{return one(id)}catch(e){return null}},m=id=>{try{return many(id)}catch(e){return[]}};
  return{tipo_baumann:P.A.map(x=>x.L).join(''),sexo:o('sexo'),edad:S.a.edad||null,pais:o('pais'),etapa:esHombre()?null:o('fase'),fototipo:S.a.foto!=null?['I','II','III','IV','V','VI'][S.a.foto]:null,
   estado_piel:m('estado'),objetivos:m('meta'),plazo:o('plazo'),enfermedades_piel:m('enf'),tratamientos:m('trat'),medicamentos:m('med'),ultima_visita_dermatologo:o('derm'),
   alergias:S.a.alerg||'',productos_actuales:m('prod'),otros_productos:S.a.prodtxt||'',afeitado:esHombre()?o('afeitado'):null,tras_afeitado:esHombre()?m('trasafeitado'):[],habitos:{sol:o('sol'),sueno:o('sueno'),estres:o('estres'),tabaco:o('tabaco'),clima:o('clima')},
   cosmetica:m('cos'),presupuesto:o('pres'),pasos:o('pasos'),preferencias:m('extra'),rutina:{manana:P.am.map(x=>x.p),noche:P.pm.map(x=>x.p)}}}catch(e){return null}}
async function compartirPerfil(){
 const s=await sesion(true);
 await fetch(SB_URL+'/rest/v1/perfiles?on_conflict=user_id',{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+s.at,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},
  body:JSON.stringify({user_id:s.uid,alias:(S.alias||'').slice(0,40)||null,resumen:resumenPerfil(),actualizado:new Date().toISOString()})})}
async function dejarDeCompartir(){const s=await sesion(true);await fetch(SB_URL+'/rest/v1/perfiles?user_id=eq.'+s.uid,{method:'DELETE',headers:{apikey:SB_KEY,Authorization:'Bearer '+s.at}})}

/* ---------- Chat con Caty ---------- */
async function cargarChat(){
 if(!C||!navigator.onLine||S.plan!=='caty')return false;
 try{const s=await sesion(false);if(!s)return false;
  const r=await fetch(SB_URL+'/rest/v1/mensajes?select=id,de,texto,creado,leido&order=creado.asc',{headers:{apikey:SB_KEY,Authorization:'Bearer '+s.at}});
  if(!r.ok)return false;const rows=await r.json();
  const mes=new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Madrid',year:'numeric',month:'2-digit'}).format(new Date());
  const enMes=t=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Madrid',year:'numeric',month:'2-digit'}).format(new Date(t))===mes;
  const antes=(S.chat||[]).length;
  S.chat=rows.map(m=>({f:m.de==='caty'?'caty':'me',t:m.texto,c:m.creado}));S.chatUsados=rows.filter(m=>m.de==='usuaria'&&enMes(m.creado)).length;
  const nuevas=rows.some(m=>m.de==='caty'&&!m.leido);
  if(nuevas){if(S.screen==='app'&&S.tab==='msgs'&&S.seg==='caty'&&!document.hidden){rpc('marcar_leidos',{}).catch(()=>{})}else S.seen=false}
  save();return S.chat.length!==antes||nuevas;
 }catch(e){return false}}
setInterval(()=>{if(!document.hidden&&S.plan==='caty'&&S.screen==='app'&&S.tab==='msgs'&&S.seg==='caty')cargarChat().then(c=>{if(c)render(true)})},20000);

const fecha=t=>new Date(t).toLocaleDateString('es-ES',{day:'numeric',month:'long'});
async function canjear(cod){
 if(!navigator.onLine){toast('Conéctate a internet para activar tu invitación.');return}
 try{
  const s=await sesion(true);
  const r=await fetch(SB_URL+'/rest/v1/rpc/canjear_invitacion',{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+s.at,'Content-Type':'application/json'},body:JSON.stringify({p_codigo:cod})});
  const j=await r.json().catch(()=>null);S.invPend=null;
  if(!r.ok){const m=(j&&j.message)||'';save();toast(m.includes('caducada')?'Esta invitación ya caducó.':m.includes('agotada')?'Esta invitación ya se usó todas las veces.':'Esta invitación no es válida.');return}
  S.inv=true;await syncPlan();save();render(true);track('invitacion');
  toast(S.vence?`¡Te damos la bienvenida! Tienes Glow Esencial gratis hasta el ${fecha(S.vence)}`:'¡Te damos la bienvenida a Glow!');
 }catch(e){toast('No pudimos activar tu invitación. Vuelve a abrir el enlace en un momento.')}}
const OPS=[['general','Glow en general'],['cuestionario','El cuestionario'],['rutina','La rutina y los productos'],['asistente','El asistente']];
function opinionSheet(){
 const o=S.op||(S.op={});
 sheet(`<h2>Tu opinión para Caty</h2><p>Puntúa de 1 a 5 y cuéntale qué mejorarías. No escribas datos de salud.</p>
${OPS.map(([k,l])=>`<div class="oprow"><span>${l}</span><div class="opstars" role="group" aria-label="${l}">${[1,2,3,4,5].map(n=>`<button aria-pressed="${o[k]===n}" data-act="rate" data-arg="${k}:${n}" aria-label="${n} de 5">${n}</button>`).join('')}</div></div>`).join('')}
<textarea id="opTxt" class="field glass" rows="4" maxlength="2000" placeholder="¿Qué te gustó? ¿Qué cambiarías? ¿Algo no funcionó?" style="margin:12px 0 14px;width:100%;box-sizing:border-box">${esc(o.texto||'')}</textarea>
<div class="stack"><button class="btn" data-act="sendop">Enviar a Caty</button><button class="btn ghost" data-act="close">Ahora no</button></div>`)}
function invCard(){return S.inv?`<section class="card glass"><h2>Estás probando Glow</h2><p class="fine" style="margin-bottom:14px">${paid()&&S.vence?`Tienes Glow Esencial gratis hasta el ${fecha(S.vence)}. `:''}Caty quiere saber qué te parece: qué te gusta, qué cambiarías y cómo te funciona el asistente (te escribe 2 días después de ver tu rutina).</p><button class="btn" data-act="opinion">${S.opEnviada?'Enviar otra opinión':'Dar mi opinión'}</button></section>`:''}
async function esperarPago(k){
 for(let i=0;i<25;i++){await new Promise(r=>setTimeout(r,i?3000:800));await syncPlan();
  if(S.plan!=='free'){S.screen=Object.keys(S.a).length?'app':S.screen;if(S.screen==='app')S.tab='rutina';go();toast(`¡Gracias! Ya tienes ${PLANS[S.plan].n}`);track('pago_ok',S.plan);return}}
 toast('Tu pago se está procesando. En unos minutos toca «Ya pagué: actualizar mi plan» en Ajustes.')}
const AMZ={es:{host:'www.amazon.es',tag:'caterinedeoli-21',name:'Amazon España'},us:{host:'www.amazon.com',tag:'caterinedeoli-20',name:'Amazon EE. UU.'}}, YS_CODE='CATYSKIN1';
const MSG_LIMIT=10;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fresh=()=>({screen:'welcome',qi:0,a:{},ph:{},tab:'piel',slot:'frontal',k:1,sample:false,plan:'free',have:{},bot:[],botOn:false,chat:[],seg:'bot',session:false,seen:true});
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.a)S=fresh();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('No queda espacio para guardar las fotos en este navegador.')}}

/* ---------- Evidencia (PubMed) ---------- */
let REF={}; /* se carga de datos/evidencia.json */
const ev=id=>id?` <a class="ev" href="https://pubmed.ncbi.nlm.nih.gov/${id}/" target="_blank" rel="noopener">Ver estudio</a>`:'';

/* ---------- Catálogo de productos (borrador para aprobar) ----------
   [marca, producto, nivel 1-3, etiquetas, enlaces {es: ASIN Amazon.es, us: ASIN Amazon.com, ys: id YesStyle}, contiene retinoide]
   Etiquetas: lc low cost, co coreana, fa farmacia, ag alta gama, na natural, pf lleva perfume */
let CATN={},CAT={}; /* se cargan de datos/catalogo.json */
const TIERN=['','Económico','Precio medio','Premium'];
const TIERMAX=[1,2,3,3];
const PREFTAG={'Low cost':'lc','Coreana':'co','Farmacia y dermocosmética':'fa','Alta gama':'ag','Natural o clean':'na'};
const TAGN={lc:'Low cost',co:'Coreana',fa:'Farmacia',ag:'Alta gama',na:'Natural',pf:'Lleva perfume'};
const mkt=()=>{const p=one('pais');return !p||p==='España'||p==='Otro país de Europa'?'es':'us'};
function link(p,m){
 if(p.ids.ys)return{url:`https://www.yesstyle.com/es/info.html/pid.${p.ids.ys}?rco=${YS_CODE}`,direct:true,store:'YesStyle'};
 const a=AMZ[m];
 if(p.ids[m])return{url:`https://${a.host}/dp/${p.ids[m]}?tag=${a.tag}`,direct:true,store:a.name};
 return{url:`https://${a.host}/s?k=${encodeURIComponent(m==='us'&&p.ids.q?p.ids.q:p.b+' '+p.n)}&tag=${a.tag}`,direct:false,store:a.name};
}
/* Marcas que nunca se recomiendan (decisión de Caty: marketing del miedo «clean») */
let MARCAS_EXCLUIDAS=['Freshly Cosmetics','Cocunat']; /* se completa con datos/catalogo.json */
const prodList=cat=>(CAT[cat]||[]).filter(([b])=>!MARCAS_EXCLUIDAS.some(m=>b.toLowerCase()===m.toLowerCase())).map(([b,n,t,c,ids,ret],i)=>({b,n,t,c,ids,ret,id:cat+i,st:ids.ys?'y':'a'}));
function picks(cat,preg,sinPerfume){
 const m=mkt(),max=TIERMAX[S.a.pres??1],prefs=many('cos').map(c=>PREFTAG[c]);
 const all=prodList(cat).filter(p=>!(preg&&p.ret));
 all.forEach(p=>{p.lk=link(p,m);p.sc=(p.t>max?-10:0)+prefs.filter(x=>p.c.includes(x)).length*3-Math.abs(max-p.t)*.8-(p.lk.direct?0:4)-(sinPerfume&&p.c.includes('pf')?3:0)});
 all.sort((a,b)=>b.sc-a.sc);
 const f=all[0];if(!f)return[];
 const s=all.find(p=>p!==f&&p.st!==f.st&&p.sc>=f.sc-4)||all[1];
 return[f,s].filter(Boolean);
}

/* ---------- Cuestionario ---------- */
let SECS=[];
let Q=[]; /* se carga de datos/cuestionario.json */
const qq=id=>Q.find(q=>q.id===id);
const one=id=>{const q=qq(id),v=S.a[id];return v==null?null:q.o[v]};
const many=id=>(S.a[id]||[]).map(i=>qq(id).o[i]);
const has=(id,lab)=>many(id).includes(lab);
/* Preguntas y opciones que dependen de otra respuesta (p. ej. hombre o mujer) */
const esHombre=()=>{const q=qq('sexo');return !!q&&S.a.sexo!=null&&q.o[S.a.sexo]==='Hombre'};

 am.push({id:'am1',p:'Limpieza suave',cat:oily?'limpGel':'limpCrema',ev:seAfeita?'34254359':undefined,t:(oily?'Gel limpiador suave, sin sulfatos fuertes.':'Agua tibia o un limpiador cremoso suave.'+sp)+(seAfeita?' Si te afeitas: lávate con agua tibia antes, usa gel o espuma y afeita a favor del pelo, sin repasar.':''),w:oily?'Retira el sebo de la noche sin resecar.':'Por la mañana tu piel no necesita una limpieza intensa.'});

  else am.push({id:'am2',p:'Sérum de barrera',cat:'barrera',ev:'35038127',t:'Sérum con ceramidas o ectoína.',w:'Refuerzan la barrera y reducen la pérdida de agua, con muy buena tolerancia.'});
 }
 if(irritAf){const i2=am.findIndex(x=>x.id==='am2'&&x.cat==='barrera');if(i2>=0)am.splice(i2,1)}
 am.push({id:'am3',p:'Hidratante',cat:oily?'hidraLigera':'hidraRica',ev:meno?'33242128':'37717558',t:oily?'Gel-crema ligera.':(meno||od==='D'?'Crema con ceramidas, colesterol y ácidos grasos.':'Crema ligera con ceramidas.')+sp,w:meno?'Con la bajada de estrógenos la piel pierde hidratación y grosor: hay que cuidar la barrera.':'Sella la hidratación y cuida la barrera.'});
 am.push({id:'am4',p:'Protector solar',cat:tinted?'spfColor':'spf',ev:tinted?'32335182':'38772426',t:tinted?'FPS 50 de amplio espectro, mejor con color (óxidos de hierro).':'FPS 50 de amplio espectro.',w:tinted?'El color protege también de la luz visible, que empeora el melasma y las manchas.':'Es el paso que más previene manchas y envejecimiento. Reaplica cada 2 horas al aire libre.'});

 let tr;
 if(preg) tr={id:'pm2',p:'Tratamiento',cat:'azelaico',ev:'36447117',t:'Sin retinoides. Ácido azelaico, con el visto bueno de tu médico.',w:'Es una de las opciones que se consideran durante el embarazo y la lactancia.'};
 else if(iso) tr={id:'pm2',p:'Reparación',cat:null,t:'Ningún retinoide ni exfoliante extra mientras tomes isotretinoína.',w:'La isotretinoína ya reseca mucho. Ahora toca reparar la barrera con tu hidratante.'};
 else if(rxret) tr={id:'pm2',p:'Tu tratamiento',cat:null,t:'Tu retinoide recetado, tal como te lo indicó tu médico.',w:'No sumes otro retinoide ni ácidos exfoliantes la misma noche.'};
 else if(rosacea) tr={id:'pm2',p:'Tratamiento',cat:'azelaico',ev:'14979745',t:'Ácido azelaico.',w:'Reduce las lesiones y las rojeces de la rosácea. Evita exfoliantes fuertes y perfumes.'};
 else if(useRet) tr={id:'pm2',p:'Retinoide',cat:'retinoide',ev:'17515510',t:'Retinal o retinol, 2 noches por semana al principio.'+(sens?' Si te irrita, aplícalo después de la hidratante.':''),w:'Mejora las líneas finas y la firmeza, pero necesita constancia: en los estudios se mide a las 24 semanas.'};

 if(S.a.pasos===2&&has('estado','Ojeras o bolsas')) pm.push({id:'pm4',p:'Contorno de ojos',cat:'contorno',t:'Con cafeína o péptidos.',w:'La zona es fina: mejor una fórmula específica.'});
 pm.push({id:'pm5',p:'Hidratante de noche',cat:oily?'hidraLigera':'hidraRica',ev:'37717558',t:oily?'Hidratante ligera que no obstruya los poros.':'Crema rica con ceramidas. Si notas mucha sequedad, unas gotas de escualano encima.',w:'Por la noche la piel pierde más agua: es el momento de reparar.'});
 [...am,...pm].forEach(s=>{s.pk=s.cat?picks(s.cat,preg||s.noRet,sinPerfume):[]});

/* ---------- Análisis de foto (orientativo) ---------- */
const cl=n=>Math.max(0,Math.min(100,Math.round(n)));
function analyze(ctx,w,h){
 const d=ctx.getImageData(w*.2|0,h*.2|0,w*.6|0,h*.6|0).data;
 let s=0,q=0,r=0,g=0,n=0,prev=0;
 for(let i=0;i<d.length;i+=4){const L=.299*d[i]+.587*d[i+1]+.114*d[i+2];s+=L;q+=L*L;r+=d[i]/(d[i]+d[i+1]+d[i+2]+1);if(i)g+=Math.abs(L-prev);prev=L;n++}
 const m=s/n,sd=Math.sqrt(Math.max(0,q/n-m*m));
 return{u:cl(100-sd*2.2),l:cl(m/2.55),r:cl((r/n-.36)*600),t:cl(100-g/n*6)};
}
function fileToPhoto(file,cb){
 const im=new Image();
 im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);cb({d:c.toDataURL('image/jpeg',.82),s:analyze(x,c.width,c.height)});URL.revokeObjectURL(im.src)};
 im.onerror=()=>toast('No pudimos abrir esa imagen. Prueba con una foto en JPG o PNG.');
 im.src=URL.createObjectURL(file);
}
function samplePhoto(){
 const c=document.createElement('canvas');c.width=600;c.height=750;const x=c.getContext('2d');
 let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
 const g=x.createRadialGradient(300,330,40,300,380,560);g.addColorStop(0,'#E6BB9F');g.addColorStop(.55,'#D7A588');g.addColorStop(1,'#B68267');x.fillStyle=g;x.fillRect(0,0,600,750);
 for(let i=0;i<9;i++){const cx=120+rnd()*360,cy=180+rnd()*420,rr=60+rnd()*110,rg=x.createRadialGradient(cx,cy,0,cx,cy,rr);rg.addColorStop(0,'rgba(205,95,85,.22)');rg.addColorStop(1,'rgba(205,95,85,0)');x.fillStyle=rg;x.fillRect(0,0,600,750)}
 x.filter='blur(2px)';
 for(let i=0;i<46;i++){const cx=60+rnd()*480,cy=60+rnd()*620,rr=3+rnd()*11;x.fillStyle=`rgba(${110+rnd()*30|0},${62+rnd()*20|0},40,${.22+rnd()*.25})`;x.beginPath();x.ellipse(cx,cy,rr,rr*(.7+rnd()*.5),rnd()*3,0,7);x.fill()}
 x.filter='blur(.6px)';x.strokeStyle='rgba(125,78,58,.28)';x.lineWidth=1.4;
 for(let i=0;i<7;i++){const y=470+i*22+rnd()*8;x.beginPath();x.moveTo(330+rnd()*30,y);x.quadraticCurveTo(430,y-30-rnd()*20,560,y-60);x.stroke()}
 x.filter='none';
 const id=x.getImageData(0,0,600,750),d=id.data;for(let i=0;i<d.length;i+=4){const v=(rnd()-.5)*22;d[i]+=v;d[i+1]+=v;d[i+2]+=v}x.putImageData(id,0,0);
 return{d:c.toDataURL('image/jpeg',.85),s:analyze(x,600,750),sample:true};
}

function canNext(q){const v=S.a[q.id];
 if(q.k==='one')return v!=null;
 if(q.k==='num'){const n=+v;return n>=12&&n<=100}
 if(q.k==='multi')return(v||[]).length>0;
 if(q.k==='group')return q.g.every(x=>S.a[x.id]!=null);
 return true}

/* ---------- Mensajes: asistente y chat con Caty ---------- */
const BOTQ='Hola, soy el asistente de Caty. Hace 2 días recibiste tu rutina. ¿Pudiste conseguir tus productos?';
function botStart(){S.botOn=true;S.seen=false;S.bot=[{f:'bot',t:BOTQ,o:[['Sí, todos','todos'],['Algunos','algunos'],['Todavía no','no'],['Tengo una duda','duda']]}]}
function missingSteps(){const P=plan();return[...P.am,...P.pm].filter(s=>s.pk.length&&!S.have[s.id])}
function botReply(k){
 const last=S.bot[S.bot.length-1];const lab=(last.o||[]).find(o=>o[1]===k);last.o=null;
 if(lab)S.bot.push({f:'me',t:lab[0]});
 const B=(t,o)=>S.bot.push({f:'bot',t,o});
 if(k==='todos'){Object.assign(S.have,Object.fromEntries(missingSteps().map(s=>[s.id,true])));B('¡Qué bien! Empieza por la rutina de mañana y suma un producto nuevo cada 2 semanas. Te escribo en 2 semanas para ver cómo va tu piel.')}
 else if(k==='algunos'||k==='no'){const m=missingSteps();
  B(m.length?`Sin problema. Te faltan estos pasos:<ul>${m.map(s=>`<li>${s.p}</li>`).join('')}</ul>En tu rutina tienes 2 opciones de compra para cada uno.`:'Según tu rutina ya tienes todo marcado. ¡Bien hecho!');
  B('¿Qué te frenó?',[['El precio','precio'],['No llega a mi país','envio'],['No sé cuál elegir','elegir'],['Tengo una duda','duda']])}
 else if(k==='precio')B('Empieza por lo que más impacto tiene: protector solar y limpiador. En cada paso, la primera opción es la que mejor encaja con tu presupuesto.',[['Ver mi rutina','gorut']]);
 else if(k==='envio')B(`YesStyle envía a casi todos los países. Usa el código ${YS_CODE} al pagar.`,[['Ver mi rutina','gorut']]);
 else if(k==='elegir')B('Elige la primera opción de cada paso: es la que mejor encaja con tu perfil y tu presupuesto.',[['Ver mi rutina','gorut'],['Tengo una duda','duda']]);
 else if(k==='duda'&&tester())B('Durante tu prueba, cuéntale tus dudas e ideas a Caty con «Dar mi opinión». Las lee todas.',[['Dar mi opinión','goop']]);
 else if(k==='goop'){return opinionSheet()}
 else if(k==='duda'){if(S.plan==='caty')B('Escríbele tu duda a Caty y te responderá en menos de 48 h.',[['Escribir a Caty','gochat']]);else B('Tu plan no incluye chat con Caty. Si quieres escribirle, puedes pasarte a Glow con Caty.',[['Ver planes','goplans']])}
 else if(k==='gorut'){S.tab='rutina';return go()}
 else if(k==='gochat'){S.seg='caty';return go(true)}
 else if(k==='goplans'){return plansSheet()}
 else if(k==='gosession'){return ACT.session()}
 go(true);
}

/* ---------- Comparador arrastrable ---------- */
function bindCompare(){
 const c=$('#cmp');if(!c)return;
 const set=x=>{const r=c.getBoundingClientRect(),p=Math.max(0,Math.min(100,(x-r.left)/r.width*100));$('#aft').style.clipPath=`inset(0 0 0 ${p}%)`;$('#hdl').style.left=p+'%'};
 let on=false;
 c.addEventListener('pointerdown',e=>{on=true;c.setPointerCapture(e.pointerId);set(e.clientX)});
 c.addEventListener('pointermove',e=>{if(on)set(e.clientX)});
 c.addEventListener('pointerup',()=>on=false);c.addEventListener('pointercancel',()=>on=false);
}

 askreset(){sheet(`<h2>¿Borrar todos tus datos?</h2><p>Se eliminarán tus respuestas y tus fotos de este teléfono. Tu plan se mantiene. No se puede deshacer.</p><div class="stack"><button class="btn danger" data-act="resetyes">Sí, borrar todo</button><button class="btn ghost" data-act="close">Cancelar</button></div>`)},
 resetyes(){closeSheet();const pl=S.plan,v=S.vence,inv=S.inv;try{localStorage.removeItem(KEY)}catch(e){}S=fresh();S.plan=pl;S.vence=v;S.inv=inv;save();render();toast('Datos borrados');track('borrado')}
};
let simVista=0;
document.addEventListener('click',e=>{const a=e.target.closest('a.buy[data-ev]');if(a){track('comprar',a.dataset.ev);enviaUso(true)}const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b.dataset.arg,b)}});
document.addEventListener('input',e=>{if(e.target.id==='chatbox'){S.borrador=e.target.value;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(x){}return}const f=e.target.dataset.field;if(!f)return;S.a[f]=e.target.value;save();const q=Q[S.qi];const n=$('#next');if(n&&q)n.disabled=!canNext(q)});
document.addEventListener('change',e=>{const k=e.target.dataset.slot;if(!k||!e.target.files[0])return;fileToPhoto(e.target.files[0],p=>{S.ph[k]=p;S.slot=k;go(true);toast('Foto guardada en tu teléfono');track('foto',k)})});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
async function boot(){
 try{
  const get=u=>fetch(u,{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(u);return r.json()});
  const [cat,cue,evi]=await Promise.all([get('datos/catalogo.json'),get('datos/cuestionario.json'),get('datos/evidencia.json')]);
  const T={low_cost:'lc',coreana:'co',farmacia:'fa',alta_gama:'ag',natural:'na',lleva_perfume:'pf'};
  CATN={};CAT={};
  cat.categorias.forEach(c=>{CATN[c.id]=c.nombre;CAT[c.id]=c.productos.map(p=>[p.marca,p.producto,p.nivel_precio,p.etiquetas.map(e=>T[e]).filter(Boolean),{es:p.amazon_es_asin||undefined,us:p.amazon_us_asin||undefined,q:p.amazon_us_busqueda||undefined,ys:p.yesstyle_pid||undefined},p.contiene_retinoide?1:0])});
  MARCAS_EXCLUIDAS=[...new Set([...MARCAS_EXCLUIDAS,...(cat.reglas.marcas_excluidas||[])])];
  SECS=cue.secciones;Q=cue.preguntas;AX=cue.baumann.ejes;WORD=cue.baumann.letras;DESC=cue.baumann.descripciones;
  REF={};evi.referencias.forEach(r=>{REF[r.pmid]=[r.titulo_es,r.cita]});
 }catch(e){
  $('#app').innerHTML=`${brandBar()}<section class="card glass empty" style="margin-top:40px"><h2>No pudimos abrir Glow</h2><p class="fine">Conéctate a internet y vuelve a abrir la app. Después funcionará también sin conexión.</p><button class="btn" onclick="location.reload()">Volver a intentar</button></section>`;
  return;
 }
 if(S.screen==='catalog')S.screen='app';
 const qs=new URLSearchParams(location.search),vuelta=qs.get('pago'),invit=qs.get('invitacion'),abrir=qs.get('abrir');
 if(vuelta||invit||abrir)history.replaceState(null,'',location.pathname);
 if(abrir&&Object.keys(S.a).length){S.screen='app';S.tab='msgs';S.seg=abrir==='caty'?'caty':'bot';track('aviso_abierto',abrir)}
 if(invit){S.invPend=invit;save()}
 checkBot();
 render();
 if(vuelta){if(C){toast('¡Gracias! Estamos activando tu plan…');esperarPago(vuelta)}else toast('¡Gracias por tu pago! Abre Glow desde donde pagaste para ver tu plan.')}
 else if(S.invPend)canjear(S.invPend);
 else syncPlan().then(async c=>{const ch=await cargarChat();if(c||ch){checkBot();render(true)}});
 track('abrir',instalada()?'instalada':'navegador');
 document.addEventListener('visibilitychange',()=>{if(document.hidden)return;syncPlan().then(async c=>{const ch=await cargarChat();if(checkBot()||c||ch)render(true)})});
 addEventListener('appinstalled',()=>track('instalada'));
}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
boot();
</script>
